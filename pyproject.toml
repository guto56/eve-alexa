[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eve"
version = "0.1.0"
description = "EVE — assistente de voz pessoal (Fase 1 / M0: validação de áudio)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",   # a roda de macOS traz a libportaudio.dylib embutida
    "pynput>=1.7.6",        # atalho global; no macOS puxa pyobjc-framework-Quartz
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
eve = "eve.apps.cli:main"

[tool.setuptools.packages.find]
include = ["eve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
